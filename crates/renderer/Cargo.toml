[package]
name = "renderer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
asset-importer = { version = "0.8", features = ["static-link"] }
flate2 = "1"
glam = "0.29"
gltf = { version = "1.4", features = ["import", "KHR_texture_transform", "KHR_materials_unlit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "dds"] }
openusd = "0.7"
roxmltree = "0.21"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tobj = "4"
ufbx = "0.10"
urlencoding = "2"
# Reuse the flate2 backend already enabled by PNG decoding; no archive encoders.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.14", default-features = false }

# asset-importer-sys 0.8 links bundled zlib for MSVC but omits it on MinGW.
[target.'cfg(all(windows, target_env = "gnu"))'.dependencies]
libz-sys = { version = "1", default-features = false, features = ["static"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"
